<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        input, button { padding: 10px; margin: 10px; width: 80%; max-width: 400px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Instagram Video Downloader</h1>
    <p>Paste the Instagram post link below:</p>

    <input type="text" id="instaLink" placeholder="Enter Instagram post URL">
    <button onclick="downloadVideo()">Download</button>

    <script>
        function downloadVideo() {
            let url = document.getElementById("instaLink").value;
            if (!url.includes("instagram.com")) {
                alert("Please enter a valid Instagram link!");
                return;
            }

            // Copy URL to clipboard
            navigator.clipboard.writeText(url).then(() => {
                alert("Link copied! Paste it on the SnapInsta site.");
            });

            // Open SnapInsta in a new tab
            window.open("https://snapinsta.app", "_blank");
        }
    </script>

</body>
</html>
